server:
  port: 8080
  tomcat:
    accept-count: 1000

spring:
  application:
    name: WSLService
  datasource:
    url: jdbc:mysql://localhost:3306/pkm?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=UTC&jdbcCompliantTruncation=false
    username: root
    password: pass
  messages:
    basename: messages
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      #      group-id: search-consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  redis:
    host: localhost
    port: 6379
    cache:
      type: redis
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect
        show_sql: true
        format_sql: true
        jdbc:
          time_zone: "Asia/Ho_Chi_Minh"
    open-in-view: false
    hibernate:
      #      ddl-auto: create
      ddl-auto: update
  #      ddl-auto: none

image:
  pokemon-large: F:/Code/images/pokemon_large
  pokemon-icon: F:/Code/images/pokemon_icon
kafka:
  server: localhost
  port: 9092
